<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <!-- Used as a mask: only the shape matters, the colour comes from CSS. -->
  <!-- school building -->
  <g transform="translate(18 20)">
    <path d="M0 40 L36 14 L72 40"/>
    <rect x="6" y="40" width="60" height="40"/>
    <rect x="28" y="56" width="16" height="24"/>
    <rect x="12" y="48" width="10" height="10"/>
    <rect x="50" y="48" width="10" height="10"/>
    <path d="M36 14 V0 H50 V7 H36"/>
  </g>
  <!-- open book -->
  <g transform="translate(200 26)">
    <path d="M0 8 C14 0 28 0 40 8 V48 C28 40 14 40 0 48 Z"/>
    <path d="M40 8 C52 0 66 0 80 8 V48 C66 40 52 40 40 48"/>
    <path d="M8 16 H30 M8 24 H30 M50 16 H72 M50 24 H72"/>
  </g>
  <!-- pencil -->
  <g transform="translate(130 70) rotate(35)">
    <rect x="0" y="0" width="12" height="60"/>
    <path d="M0 60 L6 74 L12 60"/>
    <path d="M0 10 H12"/>
  </g>
  <!-- bench -->
  <g transform="translate(24 170)">
    <rect x="0" y="0" width="80" height="8"/>
    <path d="M8 8 V36 M72 8 V36"/>
    <rect x="0" y="20" width="80" height="6"/>
  </g>
  <!-- graduation cap -->
  <g transform="translate(206 150)">
    <path d="M0 18 L40 0 L80 18 L40 36 Z"/>
    <path d="M16 26 V44 C28 54 52 54 64 44 V26"/>
    <path d="M80 18 V40"/>
  </g>
  <!-- bell -->
  <g transform="translate(140 196)">
    <path d="M6 34 C6 14 12 6 22 6 C32 6 38 14 38 34 Z"/>
    <path d="M0 34 H44"/>
    <path d="M22 0 V6"/>
    <circle cx="22" cy="40" r="4"/>
  </g>
  <!-- ruler -->
  <g transform="translate(36 262) rotate(-8)">
    <rect x="0" y="0" width="96" height="16"/>
    <path d="M12 0 V7 M24 0 V5 M36 0 V7 M48 0 V5 M60 0 V7 M72 0 V5 M84 0 V7"/>
  </g>
  <!-- Bangla letters -->
  <text x="214" y="270" font-family="Noto Sans Bengali, sans-serif" font-size="30" stroke-width="1.4">অ আ</text>
  <text x="240" y="306" font-family="Noto Sans Bengali, sans-serif" font-size="22" stroke-width="1.2">ক খ</text>
  <!-- English letters and numbers -->
  <text x="150" y="150" font-family="Arial, sans-serif" font-size="26" font-weight="700" stroke-width="1.2">A B C</text>
  <text x="120" y="300" font-family="Arial, sans-serif" font-size="20" font-weight="700" stroke-width="1">1 2 3</text>
  <!-- small stars -->
  <path d="M170 30 l3 6 6 1 -5 4 1 6 -5 -3 -5 3 1 -6 -5 -4 6 -1z"/>
  <path d="M290 110 l2 4 4 1 -3 3 1 4 -4 -2 -4 2 1 -4 -3 -3 4 -1z"/>
</svg>
