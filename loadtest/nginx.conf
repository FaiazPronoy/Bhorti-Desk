# Spreads the load test over both backends, one request to each in turn.
events {
    # The default of 512 runs out with 600 guardians at once, and nginx itself answers
    # 500 before any request reaches an API. Each proxied request needs two connections.
    worker_connections 4096;
}

http {
    upstream api {
        server backend:8080;
        server backend-second:8080;
        keepalive 64;
    }

    server {
        listen 8080;
        location / {
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
