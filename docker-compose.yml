services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-school_admission}
      POSTGRES_USER: ${POSTGRES_USER:-school_admission}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_only_password}
    volumes:
      - admission_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      DATABASE_CONNECTION_STRING: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-school_admission};Username=${POSTGRES_USER:-school_admission};Password=${POSTGRES_PASSWORD:-local_dev_only_password};Maximum Pool Size=40;Timeout=30"
      HOLD_DURATION_SECONDS: ${HOLD_DURATION_SECONDS:-600}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}
      ASPNETCORE_HTTP_PORTS: "8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # A second API process on the same database, to show that the seat limit
  # holds across two backends. Start it with: docker compose --profile two-backends up
  backend-second:
    profiles: ["two-backends"]
    build: ./backend
    ports:
      - "8081:8080"
    environment:
      DATABASE_CONNECTION_STRING: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-school_admission};Username=${POSTGRES_USER:-school_admission};Password=${POSTGRES_PASSWORD:-local_dev_only_password};Maximum Pool Size=40;Timeout=30"
      HOLD_DURATION_SECONDS: ${HOLD_DURATION_SECONDS:-600}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}
      ASPNETCORE_HTTP_PORTS: "8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "${FRONTEND_PORT:-3000}:8080"
    environment:
      API_BASE_URL: ${API_BASE_URL:-http://localhost:8080}
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  admission_postgres_data:
