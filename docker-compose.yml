services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-school_admission}
      POSTGRES_USER: ${POSTGRES_USER:-school_admission}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_only_password}
    volumes:
      - admission_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      DATABASE_CONNECTION_STRING: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-school_admission};Username=${POSTGRES_USER:-school_admission};Password=${POSTGRES_PASSWORD:-local_dev_only_password};Maximum Pool Size=40;Timeout=30"
      HOLD_DURATION_SECONDS: ${HOLD_DURATION_SECONDS:-600}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}
      ASPNETCORE_HTTP_PORTS: "8080"
      # Off keeps the original no-login contract. On needs guardian and staff sign-in.
      SIGN_IN_REQUIRED: ${SIGN_IN_REQUIRED:-false}
      RATE_LIMITS_ENABLED: ${RATE_LIMITS_ENABLED:-false}
      HOLD_COOLDOWN_SECONDS: ${HOLD_COOLDOWN_SECONDS:-0}
      DEMO_MODE: ${DEMO_MODE:-false}
      # First school office account. Change both before anyone else can reach the app.
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@bhortidesk.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-this-local-password}
      # Local demo only: no SMS provider, so sign-in codes go to "docker compose logs backend".
      OTP_LOG_CODES: ${OTP_LOG_CODES:-true}
      # Plain http on localhost. Set to true behind HTTPS.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # A second API process on the same database, to show that the seat limit
  # holds across two backends. Start it with: docker compose --profile two-backends up
  backend-second:
    profiles: ["two-backends"]
    build: ./backend
    ports:
      - "8081:8080"
    environment:
      DATABASE_CONNECTION_STRING: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-school_admission};Username=${POSTGRES_USER:-school_admission};Password=${POSTGRES_PASSWORD:-local_dev_only_password};Maximum Pool Size=40;Timeout=30"
      HOLD_DURATION_SECONDS: ${HOLD_DURATION_SECONDS:-600}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}
      ASPNETCORE_HTTP_PORTS: "8080"
      SIGN_IN_REQUIRED: ${SIGN_IN_REQUIRED:-false}
      RATE_LIMITS_ENABLED: ${RATE_LIMITS_ENABLED:-false}
      HOLD_COOLDOWN_SECONDS: ${HOLD_COOLDOWN_SECONDS:-0}
      DEMO_MODE: ${DEMO_MODE:-false}
      # First school office account. Change both before anyone else can reach the app.
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@bhortidesk.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-this-local-password}
      # Local demo only: no SMS provider, so sign-in codes go to "docker compose logs backend".
      OTP_LOG_CODES: ${OTP_LOG_CODES:-true}
      # Plain http on localhost. Set to true behind HTTPS.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "${FRONTEND_PORT:-3000}:8080"
    environment:
      # "/api" goes through this container's nginx to the backend, so the page and the
      # API share one origin and the session cookie stays first-party.
      API_BASE_URL: ${API_BASE_URL:-/api}
      SIGN_IN_REQUIRED: ${SIGN_IN_REQUIRED:-false}
      DEMO_MODE: ${DEMO_MODE:-false}
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  admission_postgres_data:
